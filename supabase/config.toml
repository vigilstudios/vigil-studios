# Supabase CLI config for the linked hosted project.
#
# Deliberately minimal. `supabase config push` only touches properties this
# file declares; everything the CLI's `init` template would add (storage,
# analytics, vector buckets, local-dev ports) is left undeclared so a push can
# never overwrite a hosted setting we did not intend to manage, and never
# trips a paid-tier feature. Migrations go through `supabase db push`.
#
# Local `supabase start` is not used (no Docker on the dev machine);
# scripts/db-validate.sh validates migrations against a plain PostgreSQL.

project_id = "vigil-studios"

[auth]
# Used as the redirect allow-list and to build the URLs in auth emails.
site_url = "https://www.vigilstudios.co"
# Wildcards: the app passes its own /auth/confirm as the redirect target and
# the allow-list must match it exactly (query strings included), or Supabase
# silently falls back to site_url.
additional_redirect_urls = [
  "https://www.vigilstudios.co/**",
  "http://localhost:3000/**",
  "http://127.0.0.1:3000/**",
]

# Custom email templates are not available on the free tier with the default
# email provider (config push returns 400). Once custom SMTP or a paid plan is
# in place, uncomment this: the link then lands on the app's /auth/confirm,
# which verifies on a POST that inbox link scanners never trigger, and works
# in any browser rather than only the one that requested it.
# [auth.email.template.magic_link]
# subject = "Sign in to Vigil"
# content_path = "./supabase/templates/magic_link.html"
