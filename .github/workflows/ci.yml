name: CI

# Every push and pull request: the same checks a release needs. `main`
# deploys vigilstudios.co on push, so a red run here is the last warning
# before customers see it.
on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:dependency-security
      - run: npm run lint
      - run: npm test
      - run: npm run db:validate
      # No secrets in CI: the build must succeed with every provider unset,
      # which is also how a misconfigured deploy would look.
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
